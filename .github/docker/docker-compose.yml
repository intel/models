version: '3'
services:
  ipex-cpu:
    image: ${REGISTRY}/aiops/mlops-ci:b-${GITHUB_RUN_NUMBER:-0}-${BASE_IMAGE_NAME:-ubuntu}-${BASE_IMAGE_TAG:-22.04}-ipex-cpu
    pull_policy: always
    build:
      context: ../../
      args:
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
        BASE_IMAGE: ubuntu
        BASE_TAG: 22.04
        PYTHON_VERSION: '3.10'
        WHL_URL: ${WHL_URL}
      dockerfile: .github/docker/pytorch/ipex-cpu-base.Dockerfile-${BASE_IMAGE_NAME:-ubuntu}
    command: >
      bash -c "python -c 'import torch; import intel_extension_for_pytorch as ipex; import torchvision; import torchaudio; import oneccl_bindings_for_pytorch as torchccl;  print(\"torch:\", torch.__version__, \" ipex:\", ipex.__version__, \" torchaudio:\", torchaudio.__version__, \" torchvision:\", torchvision.__version__, \"torchccl:\",torchccl.__version__)'"
