name: Mirror sync-up
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions: write-all
jobs:
  mirror-sync:
    name: Mirror sync-up
    runs-on: self-hosted
    steps:
      - name: Debug runner info
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          whoami
          pwd
      - name: Install required packages
        if: runner.os == 'Linux'
        run: |
          # Check if packages are available, skip installation if sudo not available
          which wget || echo "wget not available, hoping it's pre-installed"
          which git || echo "git not available, hoping it's pre-installed"
      - name: Java Set Up
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'
      - name: Sync external repo
        id: mirror-repo
        run: |
          wget --quiet https://repo1.maven.org/maven2/com/madgag/bfg/1.14.0/bfg-1.14.0.jar
          # Cleanup any previous clone on this node
          rm -rf airm-branches-subset
          git clone --single-branch --branch main \
            https://${{ github.actor }}:${{ github.token }}@github.com/intel-innersource/frameworks.ai.models.intel-models.git \
            airm-branches-subset
          cd airm-branches-subset
          BRANCHES='pytorch-r2.2-models pytorch-r2.3-models r3.4 r3.4.1'
          for branch in $BRANCHES; do git fetch origin $branch:$branch; done
          cd ..
          rm -rf airm-branches-subset-bare
          git clone --bare airm-branches-subset airm-branches-subset-bare
          cd airm-branches-subset-bare
          java -jar ../bfg-1.14.0.jar --delete-folders .github --delete-files .github --no-blob-protection
          git reflog expire --expire=now --all && git gc --prune=now --aggressive
          # Use token directly without username for public GitHub
          git push --mirror https://${{ secrets.TF_QA_PROD_PUBLIC_TOKEN }}@github.com/intel/ai-reference-models.git
      - name: Cleanup
        if: always()
        run: |
          rm -fr airm-bare-main-branch*
          rm bfg-1.14.0.jar
