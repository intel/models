name: PR validations
on:
  pull_request: null
permissions: read-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks_setup:
    name: Setup checks
    runs-on: k8-runners
    outputs:
      checks: ${{ steps.set_checks.outputs.checks }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - uses: actions/checkout@v6
      - name: Analyze changed files
        id: set_checks
        run: |
          python3.10 -m pip install -r .github/utils/requirements.txt
          echo "checks=`python .github/utils/checks-setup.py \
            -c .github/config/compliance-config.json \
            -f smoke.yaml \
            pr-check \
            -u ${{ github.event.pull_request.url }}`" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Print checks information
        run:
          echo ${{ toJson(steps.set_checks.outputs.checks) }} | jq
  bom_changes:
    name: BoM changes found
    needs: checks_setup
    runs-on: k8-runners
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: ${{ fromJson(needs.checks_setup.outputs.checks).flags.is_bom_change }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - uses: actions/checkout@v6
      - name: Call BoM change action
        run:
          python3.10 .github/utils/comment-bom-changes.py
            -u '${{ github.event.pull_request.url }}'
            -j '${{ toJson(fromJson(needs.checks_setup.outputs.checks).files.bom) }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  containers_check:
    name: Build and Smoke Test Container
    needs: checks_setup
    if: ${{ fromJson(needs.checks_setup.outputs.checks).flags.is_container_change }}
    runs-on: ${{ matrix.container.runner }}
    strategy:
      matrix:
        container: ${{ fromJSON(needs.checks_setup.outputs.checks).services }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Docker Compose Up
        run: docker compose -p ${{ matrix.container.project }} -f ${{ matrix.container.file }} up --build ${{ matrix.container.service }}
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Get Test Runner
        uses: actions/checkout@v6
        with:
          repository: intel/ai-containers
          path: ai-containers
      - name: Install Requirements
        run: python3.10 -m pip install -r ai-containers/test-runner/requirements.txt
      - name: Check smoke test file
        run: test -f ${{ matrix.container.smoke }}
      - name: Execute Test Runner
        shell: bash
        run: python3.10 ai-containers/test-runner/test_runner.py -f ${{ matrix.container.smoke }}
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Docker Compose Down
        if: always()
        run: docker compose -p ${{ matrix.container.project }} -f ${{ matrix.container.file }} down ${{ matrix.container.service }}
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
