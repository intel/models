name: Models v2 compliance check
on: [pull_request]
permissions: read-all

jobs:
  models_check:
    runs-on: k8-runners
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Default version for Ubuntu 24.04
      - name: Checking models v2 compliance
        run: |
          yes | python3 -m pip install pyyaml termcolor
          python3 .github/utils/models_v2-compliance-check.py --models_dir models_v2 --config_file .github/config/compliance-config.json
