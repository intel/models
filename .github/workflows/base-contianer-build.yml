name: Build IPEX base container
on:
  workflow_dispatch:
    inputs:
      whl_url:
        description: IPEX binary URL
        required: true

jobs:
  build-base-container:
    name: Build IPEX Base Container
    runs-on: k8-runners
    steps:
    - uses: docker/login-action@v3.3.0
      with:
        registry: ${{ secrets.REGISTRY }}
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
    - name: Build Container
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        WHL_URL: $${{ inputs.whl_url }}
        REGISTRY: $${{ secrets.REGISTRY }}
      run: docker compose build -f ${{ github.workspace }}/.github/docker/pytorch/docker-compose.yml ipex-cpu
